<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const rnd = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);

// glitched horned smiley: wobbly hand-drawn outline, blob eyes, crooked smile,
// two sliced glitch bands, and pink/cyan colour-split ghosts
let gid = 0;
function smiley(parent, cx, cy, r, attrs) {
  const sw = parseFloat(attrs["stroke-width"] || 1.8), col = attrs.stroke || "#7dff8e";
  const wob = (i) => 1 + 0.012 * Math.sin(i * 1.7) + 0.008 * Math.sin(i * 4.1 + 1);
  const P = (a, k = 1) => [cx + r * k * Math.sin(a), cy - r * k * Math.cos(a)];
  const pts = [];
  const arc = (a0, a1, n) => { for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push(P(a, wob(pts.length))); } };
  const horn = (side) => {                       // outer base -> tip -> inner base (or reversed on the right)
    const q = (t, p0, c, p1) => [(1-t)*(1-t)*p0[0] + 2*(1-t)*t*c[0] + t*t*p1[0], (1-t)*(1-t)*p0[1] + 2*(1-t)*t*c[1] + t*t*p1[1]];
    const outer = P(side * 0.98), inner = P(side * 0.56), tip = [cx + side * r * 0.9, cy - r * 1.36];
    const co = [cx + side * r * 1.16, cy - r * 0.98], ci = [cx + side * r * 0.66, cy - r * 1.0];
    const seq = [];
    for (let i = 0; i <= 8; i++) seq.push(q(i / 8, outer, co, tip));
    for (let i = 1; i <= 8; i++) seq.push(q(i / 8, tip, ci, inner));
    return side < 0 ? seq : seq.reverse();
  };
  pts.push(...horn(-1)); arc(-0.56, 0.56, 10); pts.push(...horn(1)); arc(0.98, 2 * Math.PI - 0.98, 34);
  // little glitch notches on the sides

  const outline = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";

  const eye = (ex, ey, flip) => { const w = r * .1, h = r * .2;
    return `M${ex} ${ey - h} C${ex + w * 1.3 * flip} ${ey - h} ${ex + w * .9 * flip} ${ey - h * .1} ${ex + w * 1.25 * flip} ${ey + h * .25}` +
           ` C${ex + w * .8 * flip} ${ey + h * 1.05} ${ex - w * 1.1 * flip} ${ey + h * 1.05} ${ex - w * 1.05 * flip} ${ey + h * .1}` +
           ` C${ex - w * 1.0 * flip} ${ey - h * .7} ${ex - w * .5 * flip} ${ey - h} ${ex} ${ey - h} Z`; };
  const eyes = eye(cx - r * .32, cy - r * .16, -1) + " " + eye(cx + r * .32, cy - r * .16, 1);
  const smile = `M${cx - r*.62} ${cy + r*.22} Q${cx - r*.45} ${cy + r*.5} ${cx - r*.28} ${cy + r*.48}` +
                ` L${cx - r*.25} ${cy + r*.56} Q${cx + r*.1} ${cy + r*.72} ${cx + r*.42} ${cy + r*.5}` +
                ` L${cx + r*.46} ${cy + r*.42} Q${cx + r*.58} ${cy + r*.36} ${cx + r*.64} ${cy + r*.2}`;

  const drawSet = (g, color, width, fillEyes, op) => {
    el("path", { d: outline, stroke: color, "stroke-width": width, fill: "none", opacity: op, "stroke-linejoin": "round" }, g);
    el("path", { d: smile, stroke: color, "stroke-width": width * 1.1, fill: "none", opacity: op, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    el("path", { d: eyes, fill: fillEyes ? color : "none", stroke: color, "stroke-width": width * .6, opacity: op }, g);
  };
  const root = el("g", { opacity: attrs.opacity ?? 1 }, parent);
  const id = "gl" + (gid++);
  // glitch bands: two horizontal slices shifted sideways
  const bands = [[cy - r * .5, r * .09, -r * .08], [cy + r * .62, r * .1, r * .1]];
  const defs = el("defs", {}, root);
  const keep = el("clipPath", { id: id + "k" }, defs);
  let yPrev = cy - r * 2;
  bands.forEach(([y, h]) => { el("rect", { x: cx - r * 2, y: yPrev, width: r * 4, height: y - yPrev }, keep); yPrev = y + h; });
  el("rect", { x: cx - r * 2, y: yPrev, width: r * 4, height: cy + r * 2 - yPrev }, keep);
  const layer = (dx, dy, clip) => { const g = el("g", { transform: `translate(${dx} ${dy})` }, root); if (clip) g.setAttribute("clip-path", `url(#${clip})`); return g; };
  const paint = (g) => {
    drawSet(layer(-sw * .9, 0, null).appendChild(el("g", {}, g)) && g, "#ff4fd2", sw, false, .55);
  };
  const pieces = [[0, id + "k"]];
  bands.forEach(([y, h, dx], i) => { const c = el("clipPath", { id: id + "b" + i }, defs); el("rect", { x: cx - r * 2, y, width: r * 4, height: h }, c); pieces.push([dx, id + "b" + i]); });
  for (const [dx, clip] of pieces) {
    const g = el("g", { "clip-path": `url(#${clip})` }, root);
    const inner = el("g", { transform: `translate(${dx} 0)` }, g);
    const off = Math.max(1, r * .045);
    drawSet(el("g", { transform: `translate(${-off} ${-off * .3})` }, inner), "#d8ffe2", sw * .9, false, .35);
    drawSet(el("g", { transform: `translate(${off} ${off * .3})` }, inner), "#0f9a3c", sw * .9, false, .7);
    const main = el("g", { filter: attrs.filter || "" }, inner);
    drawSet(main, col, sw, true, 1);
  }
  return root;
}
smiley(document.getElementById("logo"), 25, 28, 12.5, { stroke: "#7dff8e", "stroke-width": 1.5, filter: "url(#glow)" });

// ---------- CRT: everything in draw(t) so the same code renders stills and animation frames
const crt = document.getElementById("crt"), W = 398, H = 144;
const FC0 = 288, RES = 0.95;
const mag = (f, fc) => { const w = f / fc, k = 3.95 * Math.min(RES, .92); let re = 1, im = 0;
  for (let n = 0; n < 4; n++) { const r2 = re - im * w, i2 = re * w + im; re = r2; im = i2; } re += k;
  return 20 * Math.log10((1 + 0.6 * k) / Math.hypot(re, im) + 1e-9); };
const X = f => W * Math.log(f / 20) / Math.log(1000), Y = db => H * (0.1 + (22 - db) / 78);
const curvePath = (fc, jitter) => { let d = ""; for (let i = 0; i <= 260; i++) { const f = 20 * Math.pow(1000, i / 260);
  d += (i ? "L" : "M") + X(f).toFixed(1) + " " + (Math.min(H + 5, Math.max(4, Y(mag(f, fc)))) + (jitter ? (rnd() - .5) * jitter : 0)).toFixed(1); } return d; };

// envelope: a 16th note every 0.115 s at 130 bpm, accents on 1 and 7
function cutoffAt(t) { const step = 60 / 130 / 4, n = Math.floor(t / step), dt = t - n * step;
  const acc = [0, 6, 10].includes(n % 16), env = Math.exp(-dt / (acc ? .09 : .16)) * (acc ? 2.6 : 1.7);
  return FC0 * Math.pow(2, env); }

// a band-limited filtered saw at the note, for the live waveform trace
function wavePath(t, fc) { let d = ""; const f0 = 55, cyc = 3.2; const step = 60 / 130 / 4, n = Math.floor(t / step);
  const notes = [0,0,12,3,0,0,7,5,0,-2,0,12,3,0,5,7], fn = f0 * Math.pow(2, notes[n % 16] / 12);
  for (let i = 0; i <= 300; i++) { const ph = i / 300 * cyc * Math.PI * 2; let y = 0;
    for (let h = 1; h <= 40; h++) { const fh = fn * h; const g = Math.pow(10, mag(fh, fc) / 20); y += Math.sin(h * (ph + t * 30)) / h * g; }
    d += (i ? "L" : "M") + (i / 300 * W).toFixed(1) + " " + (H * .8 - y * 5).toFixed(1); } return d; }

function draw(t, live) {
  crt.innerHTML = "";
  el("rect", { width: W, height: H, rx: 8, fill: "#071419" }, crt);
  const g = el("g", { stroke: "#1f4a52", "stroke-width": 1 }, crt);
  for (let i = 1; i < 10; i++) el("line", { x1: i * W / 10, y1: 0, x2: i * W / 10, y2: H }, g);
  for (let j = 1; j < 6; j++) el("line", { x1: 0, y1: j * H / 6, x2: W, y2: j * H / 6 }, g);
  const tk = el("g", { stroke: "#2f6e78", "stroke-width": 1 }, crt);
  for (let i = 0; i < 50; i++) el("line", { x1: i * W / 50, y1: H / 2 - 3, x2: i * W / 50, y2: H / 2 + 3 }, tk);
  for (let j = 0; j < 30; j++) el("line", { x1: W / 2 - 3, y1: j * H / 30, x2: W / 2 + 3, y2: j * H / 30 }, tk);

  smiley(crt, W / 2, H / 2 + 8, 40, { stroke: "#7dff8e", "stroke-width": 1.8, filter: "url(#glow)", opacity: live ? .45 + .08 * Math.sin(t * 9) : .5 });

  const fc = live ? cutoffAt(t) : FC0;
  if (live) {
    // phosphor persistence: the last few positions fade out behind the beam
    for (let k = 6; k >= 1; k--) el("path", { d: curvePath(cutoffAt(Math.max(0, t - k * .025)), 0), stroke: "#7dff8e", "stroke-width": 2, fill: "none", opacity: .09 * (7 - k) / 6 * 1.6 }, crt);
    el("path", { d: wavePath(t, fc), stroke: "#c8ffd6", "stroke-width": 1.2, fill: "none", filter: "url(#glow)", opacity: .5 }, crt);
  } else {
    el("path", { d: wavePath(0.02, FC0 * 2.2), stroke: "#c8ffd6", "stroke-width": 1.2, fill: "none", filter: "url(#glow)", opacity: .5 }, crt);
  }
  el("path", { d: curvePath(fc, live ? .8 : 0), stroke: "#7dff8e", "stroke-width": 2.2, fill: "none", filter: "url(#glow)", opacity: live ? .92 + .08 * Math.sin(t * 50) : 1 }, crt);

  const lab = (txt, x, y, anchor = "start", c = "#7dff8e") => { const e = el("text", { x, y, fill: c, "font-family": "Dot", "font-size": 11, "text-anchor": anchor, opacity: .85 }, crt); e.textContent = txt; };
  lab("CH1 LPF 24", 8, 14); lab("CH2 OUT", 8, 28, "start", "#c8ffd6"); lab("RES 95%", W - 8, 14, "end");
  lab("20Hz", 8, H - 8); lab("20kHz", W - 8, H - 8, "end");
  const hz = Math.round(fc); lab((hz < 1000 ? hz + " Hz" : (hz / 1000).toFixed(1) + " kHz"), X(fc) + 8, Math.max(26, Y(mag(fc, fc)) + 4));

  // the room's pink light reflected on the glass: a soft glare, and the ceiling LED strip as a thin streak
  el("ellipse", { cx: W * .22, cy: -10, rx: W * .45, ry: 46, fill: "rgba(120,255,160,.08)", filter: "url(#soft)" }, crt);
  el("path", { d: `M${W*.04} 10 Q${W*.5} 2 ${W*.96} 12`, stroke: "rgba(160,255,190,.25)", "stroke-width": 2, fill: "none", filter: "url(#soft)" }, crt);
  el("path", { d: `M${W*.62} ${H} L${W*.78} 0`, stroke: "rgba(120,255,160,.05)", "stroke-width": 26, fill: "none", filter: "url(#soft)" }, crt);
  el("rect", { width: W, height: H, rx: 8, fill: "url(#scan)" }, crt);
}

// ---------- knobs with a pink rim light and a specular highlight
function knob(cx, cy, size, v, label, readout) {
  const host = document.getElementById("knobs");
  const box = document.createElement("div"); box.className = "abs"; host.appendChild(box);
  const w = size + 46; box.style.left = (cx - w / 2) + "px"; box.style.top = (cy - w / 2) + "px";
  const s = el("svg", { width: w, height: w + 34 }, box);
  const c = w / 2, R = size / 2, a0 = -135, a1 = 135, ang = a0 + v * (a1 - a0);
  const pt = (r, a) => [c + r * Math.sin(a * Math.PI / 180), c - r * Math.cos(a * Math.PI / 180)];
  for (let i = 0; i <= 10; i++) { const a = a0 + i * 27, [x1, y1] = pt(R + 6, a), [x2, y2] = pt(R + (i % 5 ? 10 : 14), a);
    el("line", { x1, y1, x2, y2, stroke: "#3dff6e", "stroke-width": i % 5 ? 1.1 : 1.8, opacity: .55 }, s); }
  el("ellipse", { cx: c, cy: c + R * .18 + 2, rx: R * 1.02, ry: R * .95, fill: "rgba(0,0,0,.7)", filter: "url(#soft)" }, s);
  el("circle", { cx: c, cy: c, r: R, fill: "url(#skirt)" }, s);
  for (let i = 0; i < 48; i++) { const a = i * 7.5, [x1, y1] = pt(R - 1, a), [x2, y2] = pt(R - 4, a);
    const lit = Math.cos(a * Math.PI / 180) > .3; el("line", { x1, y1, x2, y2, stroke: lit ? "#3fbf63" : "#173521", "stroke-width": 1.4 }, s); }
  el("circle", { cx: c, cy: c, r: R, fill: "none", stroke: "url(#rim)", "stroke-width": 1.6 }, s);
  el("circle", { cx: c, cy: c, r: R * .74, fill: "url(#knobCap)", stroke: "#000", "stroke-width": 1 }, s);
  el("ellipse", { cx: c - R * .2, cy: c - R * .38, rx: R * .34, ry: R * .14, fill: "rgba(120,255,160,.22)", filter: "url(#soft)" }, s);
  const [ix1, iy1] = pt(R * .2, ang), [ix2, iy2] = pt(R * .95, ang);
  el("line", { x1: ix1, y1: iy1, x2: ix2, y2: iy2, stroke: "#b9ffcb", "stroke-width": size > 60 ? 3.2 : 2.4, "stroke-linecap": "round" }, s);
  const t = el("text", { x: c, y: w + 6, "text-anchor": "middle", "font-family": "Plex", "font-weight": 700, "font-size": 10, "letter-spacing": 1.6, fill: "#5dff84" }, s); t.textContent = label;
  const rw = readout.length * 7.4 + 14;
  el("rect", { x: c - rw / 2, y: w + 13, width: rw, height: 17, rx: 3, fill: "#061114" }, s);
  const r = el("text", { x: c, y: w + 26, "text-anchor": "middle", "font-family": "Dot", "font-size": 12, fill: "#7dff8e", filter: "url(#glow)" }, s); r.textContent = readout;
}
knob(84, 262, 46, .5, "TUNE", "+0 st"); knob(186, 262, 46, .5, "PW", "n/a");
knob(84, 392, 46, 0, "SUB", "0%");   knob(186, 392, 46, .2, "SLIDE", "50 ms");
knob(314, 366, 46, .7, "ENV MOD", "70%"); knob(414, 352, 76, .37, "CUTOFF", "288 Hz"); knob(522, 352, 76, .95, "RESONANCE", "95%");
knob(612, 366, 46, .55, "DECAY", "623 ms"); knob(680, 366, 46, .8, "ACCENT", "80%");
knob(806, 258, 46, .6, "DRIVE", "60%"); knob(914, 258, 46, .75, "TONE", "75%");
knob(806, 392, 46, .6, "LEVEL", "-1.2 dB"); knob(914, 392, 46, 1, "MIX", "100%");

(() => { const b = document.getElementById("barcode"); let xx = 0; [2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,2,1,1].forEach((w, i) => {
  if (i % 2 == 0) el("rect", { x: xx, y: 0, width: w * 1.3, height: 20, fill: "#3dff6e", opacity: .6 }, b); xx += w * 1.3 + .6; }); })();
(() => { const m = document.getElementById("meter"); for (let r = 0; r < 2; r++) for (let i = 0; i < 22; i++) {
  const lit = i < 16, hot = i >= 19; el("rect", { x: i * 6.8, y: r * 10, width: 5, height: 7, rx: 1, fill: lit ? (hot ? "#d8ffe2" : "#3dff6e") : "#0d2414", filter: lit ? "url(#glow)" : "" }, m); } })();

(() => { const rain = document.getElementById("rain");
  const glyphs = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+-<>";
  for (let col = 0; col < 72; col++) {
    const x = 6 + col * 14 + (rnd() - .5) * 4, len = 6 + Math.floor(rnd() * 22), head = rnd() * 640 - 40;
    for (let k = 0; k < len; k++) {
      const y = head - k * 15; if (y < -10 || y > 610) continue;
      const tEl = el("text", { x, y, "font-family": "Dot", "font-size": 13, fill: k === 0 ? "#d8ffe2" : "#3dff6e",
        opacity: ((k === 0 ? .55 : .32 * (1 - k / len)) * (y < 82 ? .35 : 1)).toFixed(2) }, rain);
      tEl.textContent = glyphs[Math.floor(rnd() * glyphs.length)];
    }
  } })();
const params = new URLSearchParams(location.search);
draw(parseFloat(params.get("t") || "0"), params.has("live"));
window.drawFrame = (t) => draw(t, true);
